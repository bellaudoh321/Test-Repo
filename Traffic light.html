<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Traffic Light Simulator</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #09091a, #29245c, #111122);
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

h1 {
    font-size: 24px;
    text-align: center;
}

.traffic-light {
    width: 170px;
    background: linear-gradient(
        180deg,
        #333,
        #111,
        #333
    );

    border: 4px solid #555;
    border-radius: 22px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    box-shadow:
        0 15px 40px rgba(0,0,0,0.7),
        inset 0 0 20px rgba(0,0,0,0.7);
}

.light {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: #222;
    border: 4px solid #111;
    cursor: pointer;
    transition: 0.2s;
    box-shadow:
        inset 0 -8px 12px rgba(0,0,0,0.7),
        0 5px 10px rgba(0,0,0,0.5);
}

/* RED */

.red.active {
    background: radial-gradient(
        circle at 35% 30%,
        #ff9999,
        #ff2020 45%,
        #a00000
    );

    box-shadow:
        0 0 20px #ff2020,
        0 0 50px rgba(255,0,0,0.7);
}

/* YELLOW */

.yellow.active {
    background: radial-gradient(
        circle at 35% 30%,
        #fff4a0,
        #ffd000 45%,
        #a87800
    );

    box-shadow:
        0 0 20px #ffd000,
        0 0 50px rgba(255,210,0,0.7);
}

/* GREEN */

.green.active {
    background: radial-gradient(
        circle at 35% 30%,
        #a0ffa0,
        #20e820 45%,
        #008000
    );

    box-shadow:
        0 0 20px #20e820,
        0 0 50px rgba(0,255,0,0.7);
}

/* POLE */

.pole {
    width: 18px;
    height: 90px;

    background: linear-gradient(
        90deg,
        #222,
        #777,
        #222
    );

    margin-top: -18px;
}

.base {
    width: 80px;
    height: 15px;

    background: #555;

    border-radius: 5px;

    box-shadow: 0 5px 10px rgba(0,0,0,0.6);
}

/* TIMER */

.timer {
    min-width: 90px;

    padding: 8px 20px;

    background: rgba(0,0,0,0.5);

    border: 1px solid #555;

    border-radius: 12px;

    text-align: center;

    font-size: 30px;

    font-family: monospace;
    font-weight: bold;

    display: none;
}

/* STATUS */

.status {
    font-size: 18px;
    font-weight: bold;

    min-height: 25px;

    text-align: center;
}

.system-off {
    color: #999;
}

.system-on {
    color: #00ff88;
}

.red-text {
    color: #ff4444;
}

.yellow-text {
    color: #ffd000;
}

.green-text {
    color: #33ff33;
}

/* BUTTONS */

.buttons {
    width: 100%;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;
}

button {
    border: none;

    padding: 13px 18px;

    border-radius: 10px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

    box-shadow: 0 5px 12px rgba(0,0,0,0.3);
}

button:active {
    transform: scale(0.94);
}

.red-btn {
    background: #d60000;
    color: white;
}

.yellow-btn {
    background: #d6a800;
    color: #111;
}

.green-btn {
    background: #009900;
    color: white;
}

.auto-btn {
    background: #6741d9;
    color: white;
}

.auto-btn.running {
    background: #00a86b;
}

.off-btn {
    background: #444;
    color: white;
}

/* MOBILE */

@media (max-width: 400px) {

    .traffic-light {
        width: 145px;
        padding: 16px;
        gap: 12px;
    }

    .light {
        width: 85px;
        height: 85px;
    }

    h1 {
        font-size: 21px;
    }

    button {
        padding: 11px 14px;
        font-size: 13px;
    }
}

</style>
</head>


<body>

<div class="container">

<h1>🚦 Traffic Light Simulator</h1>


<!-- TRAFFIC LIGHT -->

<div class="traffic-light">

    <div
        id="red"
        class="light red"
        onclick="manualLight('red')">
    </div>

    <div
        id="yellow"
        class="light yellow"
        onclick="manualLight('yellow')">
    </div>

    <div
        id="green"
        class="light green"
        onclick="manualLight('green')">
    </div>

</div>


<!-- POLE -->

<div class="pole"></div>

<div class="base"></div>


<!-- TIMER -->

<div
    id="timer"
    class="timer">
</div>


<!-- STATUS -->

<div
    id="status"
    class="status system-off">
    System Off
</div>


<!-- LIGHT BUTTONS -->

<div class="buttons">

    <button
        class="red-btn"
        onclick="manualLight('red')">
        🔴 Red
    </button>

    <button
        class="yellow-btn"
        onclick="manualLight('yellow')">
        🟡 Yellow
    </button>

    <button
        class="green-btn"
        onclick="manualLight('green')">
        🟢 Green
    </button>

</div>


<!-- CONTROL BUTTONS -->

<div class="buttons">

    <button
        id="autoButton"
        class="auto-btn"
        onclick="toggleAuto()">
        🔄 Auto
    </button>

    <button
        class="off-btn"
        onclick="turnOff()">
        ⏹️ Off
    </button>

</div>

</div>


<script>

/* =================================
   TRAFFIC LIGHT SIMULATOR
   ================================= */


/* LIGHTS */

var redLight = document.getElementById("red");
var yellowLight = document.getElementById("yellow");
var greenLight = document.getElementById("green");

var timer = document.getElementById("timer");
var statusText = document.getElementById("status");
var autoButton = document.getElementById("autoButton");


/* VARIABLES */

var autoRunning = false;

var autoTimer = null;
var countdownTimer = null;

var currentIndex = 0;

var remainingSeconds = 0;


/* DURATIONS */

var lightTimes = {
    red: 10,
    yellow: 3,
    green: 8
};


/* AUTO ORDER */

var lightsOrder = [
    "red",
    "yellow",
    "green"
];


/* =================================
   CLEAR LIGHTS
   ================================= */

function clearLights() {

    redLight.classList.remove("active");
    yellowLight.classList.remove("active");
    greenLight.classList.remove("active");

}


/* =================================
   TURN ON A LIGHT
   ================================= */

function showLight(color) {

    clearLights();

    if (color === "red") {
        redLight.classList.add("active");
    }

    if (color === "yellow") {
        yellowLight.classList.add("active");
    }

    if (color === "green") {
        greenLight.classList.add("active");
    }

}


/* =================================
   STOP ALL TIMERS
   ================================= */

function stopTimers() {

    if (autoTimer !== null) {
        clearTimeout(autoTimer);
        autoTimer = null;
    }

    if (countdownTimer !== null) {
        clearInterval(countdownTimer);
        countdownTimer = null;
    }

}


/* =================================
   UPDATE STATUS
   ================================= */

function showStatus(color) {

    statusText.className = "status";

    if (color === "red") {

        statusText.innerHTML = "● STOP";

        statusText.classList.add("red-text");

    }

    else if (color === "yellow") {

        statusText.innerHTML = "● CAUTION";

        statusText.classList.add("yellow-text");

    }

    else if (color === "green") {

        statusText.innerHTML = "● GO";

        statusText.classList.add("green-text");

    }

    else {

        statusText.innerHTML = "System Off";

        statusText.classList.add("system-off");

    }

}


/* =================================
   SHOW SYSTEM ON
   ================================= */

function systemOn() {

    /*
       This changes the status to
       SYSTEM ON before displaying
       the traffic-light message.
    */

    statusText.innerHTML = "System On";

}


/* =================================
   MANUAL LIGHT
   ================================= */

function manualLight(color) {

    /* Stop automatic mode */

    stopTimers();

    autoRunning = false;

    autoButton.classList.remove("running");

    autoButton.innerHTML = "🔄 Auto";


    /* Turn on selected light */

    showLight(color);


    /* Show system ON first */

    systemOn();


    /* Give the status a moment,
       then show STOP/CAUTION/GO */

    setTimeout(function() {

        if (!autoRunning) {
            showStatus(color);
        }

    }, 700);


    /* Hide timer */

    timer.style.display = "none";

}


/* =================================
   TURN OFF
   ================================= */

function turnOff() {

    stopTimers();

    autoRunning = false;

    autoButton.classList.remove("running");

    autoButton.innerHTML = "🔄 Auto";

    clearLights();

    timer.innerHTML = "";

    timer.style.display = "none";

    statusText.className = "status system-off";

    statusText.innerHTML = "System Off";

}


/* =================================
   START AUTO
   ================================= */

function startAuto() {

    stopTimers();

    autoRunning = true;

    autoButton.classList.add("running");

    autoButton.innerHTML = "⏹ Auto Running";


    currentIndex = 0;


    runNextLight();

}


/* =================================
   RUN NEXT LIGHT
   ================================= */

function runNextLight() {

    if (!autoRunning) {
        return;
    }


    var color = lightsOrder[currentIndex];

    var duration = lightTimes[color];


    /* Turn light on */

    showLight(color);


    /* System ON */

    systemOn();


    /* Show timer */

    timer.style.display = "block";


    remainingSeconds = duration;

    timer.innerHTML = remainingSeconds;


    /* Show traffic status */

    setTimeout(function() {

        if (autoRunning) {
            showStatus(color);
        }

    }, 500);


    /* Countdown */

    countdownTimer = setInterval(function() {

        remainingSeconds--;

        timer.innerHTML = remainingSeconds;


        if (remainingSeconds <= 0) {

            clearInterval(countdownTimer);

            countdownTimer = null;

        }

    }, 1000);


    /* Change to next light */

    autoTimer = setTimeout(function() {

        if (!autoRunning) {
            return;
        }


        /* Stop current countdown */

        if (countdownTimer !== null) {

            clearInterval(countdownTimer);

            countdownTimer = null;

        }


        /* Move to next light */

        currentIndex++;


        if (currentIndex >= lightsOrder.length) {

            currentIndex = 0;

        }


        /* Run next light */

        runNextLight();


    }, duration * 1000);

}


/* =================================
   AUTO BUTTON
   ================================= */

function toggleAuto() {

    if (autoRunning) {

        turnOff();

    }

    else {

        startAuto();

    }

}


/* =================================
   KEYBOARD CONTROLS
   ================================= */

document.addEventListener("keydown", function(event) {

    var key = event.key.toLowerCase();


    if (key === "r") {
        manualLight("red");
    }

    else if (key === "y") {
        manualLight("yellow");
    }

    else if (key === "g") {
        manualLight("green");
    }

    else if (key === "a") {
        toggleAuto();
    }

    else if (key === "o") {
        turnOff();
    }

});


/* =================================
   STARTING STATE
   ================================= */

turnOff();

</script>

</body>
</html>
